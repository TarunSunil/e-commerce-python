$('co').onchange=function(e){S.k=e.target.value;route()};
$('q').onchange=function(e){var p=P.filter(function(x){return x[1]===e.target.value})[0];if(p)location.hash='/p/'+p[0]};
$('th').onclick=function(){var r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0A1412';r.dataset.theme=d?'light':'dark'};
document.addEventListener('click',function(e){var a=e.target.closest('[data-a],[data-p],[data-m]');if(!a)return;
 if(a.dataset.a){S.cart[a.dataset.a]=(S.cart[a.dataset.a]||0)+1;chrome();toast('Added to cart')}
 if(a.dataset.p){S.cart[a.dataset.p]++;route()}if(a.dataset.m){S.cart[a.dataset.m]--;if(!S.cart[a.dataset.m])delete S.cart[a.dataset.m];route()}});
document.addEventListener('submit',function(e){if(e.target.id!=='ck')return;e.preventDefault();var f=e.target,pm=f.querySelector('input[name=pm]:checked').value,s=sub();S.last={id:'MR-'+Math.random().toString(36).slice(2,8).toUpperCase(),e:f.email.value,pm:pm,t:s+(s>=75?0:6)};S.cart={};location.hash='/done'});
addEventListener('hashchange',route);
addEventListener('scroll',function(){var h=document.getElementById('hero');if(h)h.style.setProperty('--p',Math.min(1,scrollY/700).toFixed(3))},{passive:true});
route();
})();
</script>
