name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://ecom_user:ecom_password@localhost:5432/ecommerce
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecom_user
          POSTGRES_PASSWORD: ecom_password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecom_user -d ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt pytest

      - name: Validate Alembic schema parity
        working-directory: ./backend
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run tests
        working-directory: ./backend
        run: pytest -q || test $? -eq 5

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build
        working-directory: ./frontend
        run: npm run build
      
      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  browser-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ecom_user:ecom_password@localhost:5432/ecommerce
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecom_user
          POSTGRES_PASSWORD: ecom_password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecom_user -d ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Prepare database and seed products
        working-directory: ./backend
        run: |
          python -m alembic upgrade head
          python seed_products.py
      - name: Start API
        working-directory: ./backend
        run: uvicorn app.main:app --host 127.0.0.1 --port 8080 &
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        working-directory: ./frontend
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  recommender-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: recommender/requirements.txt
      
      - name: Install dependencies
        working-directory: ./recommender
        run: pip install -r requirements.txt
      
      - name: Lint
        working-directory: ./recommender
        run: pip install flake8 && flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, recommender-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      
      - name: Build backend image
        run: docker build -t ecommerce-backend:latest ./backend

      - name: Build frontend image
        run: docker build -t ecommerce-frontend:latest ./frontend
      
      - name: Build recommender image
        run: docker build -t ecommerce-recommender:latest ./recommender
